version: '3.8'

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: telemetry_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: techmanager_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telemetry_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: telemetry_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rootpassword
    ports:
      - "5672:5672"   # Puerto para conexión de los microservicios (AMQP)
      - "15672:15672" # Puerto para el panel de administración web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - telemetry_net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  telemetry_net:
    driver: bridge